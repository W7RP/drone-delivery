hold_retry_s = { value = 15.0, unit = "s", assumption = true }
pc_silence_alert_s = { value = 30.0, unit = "s", assumption = true }
# A message that overtook an earlier one waits this long for it (spec A70).
reorder_window_s = { value = 1.0, unit = "s", assumption = true }

[policy]
