# Demo scenario of Phase 7: the VTOL layout with every realism key on. Pad layout, repair,
# yield on request, derived latch fault, marker self-check, reorder window and battery-mass
# coupling as in parts_logistics_pittsburgh_vtol_layout; weather (2.10) from the committed AGC
# series with the per-route energy guard (A89); traffic (2.11) in US Eastern local time (A90);
# order outcomes (M11). It starts at local midnight on Monday 2023-01-02, the first complete
# week of the series. Every number is a placeholder (assumption = true), not real data.

schema_version = "1.9.0"

# No scheduled faults; random pad-controller faults still follow pad_ops.pc_fault_rate_per_h.
faults = []

[meta]
name = "parts_logistics_pittsburgh_vtol_demo"
preset = "PARTS_LOGISTICS"
status = "COMPLETE"
city = "Pittsburgh"
description = "The VTOL layout with every realism key on: repair, yield on request, derived latch fault, marker self-check, reorder window, hourly AGC weather with the energy route guard, road traffic in local time and order outcomes, one week from Monday 2023-01-02."

[sim]
