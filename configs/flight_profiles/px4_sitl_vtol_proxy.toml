# VTOL flight profile fitted to PX4 SITL flights of the scaled standard VTOL (docs/vtol.md).
# Generated by `pipeline/run.sh calib vtol` from pipeline/calib/vtol_fitted_params.json; do not
# edit. SITL has no power model: powers come from the energy proxy of spec A57 and A92, so every
# value is a placeholder (assumption = true) with source px4-sitl-proxy. Bootstrap std per key:
#   takeoff_s: 0.1242
#   approach_s: 0.6279
#   hop_s: 0.3996
#   hover_power_ref_w: 4.2157
#   cruise_speed_mps: 0.0536
#   cruise_mass_exponent: 0.0279
#   cruise_power_ref_w: 4.4689
#   transition_s: 0.6905
#   transition_power_ref_w: 94.9411
#   power_ref_mass_kg: 0.0

name = "px4_sitl_vtol_proxy"
source = "px4-sitl-proxy"

[drone]
airframe = "VTOL"
cruise_speed_mps = { value = 15.2112, unit = "m/s", assumption = true }
cruise_power_ref_w = { value = 556.4254, unit = "W", assumption = true }
hover_power_ref_w = { value = 1472.485, unit = "W", assumption = true }
power_ref_mass_kg = { value = 14.6, unit = "kg", assumption = true }
takeoff_s = { value = 26.2127, unit = "s", assumption = true }
approach_s = { value = 49.876, unit = "s", assumption = true }
hop_s = { value = 24.158, unit = "s", assumption = true }
transition_s = { value = 14.3041, unit = "s", assumption = true }
transition_power_ref_w = { value = 2657.8116, unit = "W", assumption = true }
cruise_mass_exponent = { value = 1.2115, unit = "1", assumption = true }
mtow_kg = { value = 16.0, unit = "kg", assumption = true }
