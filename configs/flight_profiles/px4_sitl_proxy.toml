# Flight profile fitted to PX4 SITL flights (docs/calibration.md). Generated by
# `pipeline/run.sh calib profile` from pipeline/calib/fitted_params.json; do not edit.
# SITL has no power model: powers come from the energy proxy of spec A57, so every value
# is a placeholder (assumption = true) with source px4-sitl-proxy.

name = "px4_sitl_proxy"
source = "px4-sitl-proxy"

[drone]
cruise_speed_mps = { value = 15.033, unit = "m/s", assumption = true }  # bootstrap std 0.0
cruise_power_ref_w = { value = 2107.87, unit = "W", assumption = true }  # bootstrap std 3.218
hover_power_ref_w = { value = 1830.508, unit = "W", assumption = true }  # bootstrap std 1.979
power_ref_mass_kg = { value = 14.6, unit = "kg", assumption = true }  # bootstrap std 0.0
takeoff_s = { value = 34.179, unit = "s", assumption = true }  # bootstrap std 0.072
approach_s = { value = 48.85, unit = "s", assumption = true }  # bootstrap std 0.16
hop_s = { value = 22.626, unit = "s", assumption = true }  # bootstrap std 0.147
