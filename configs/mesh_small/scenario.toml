# Eight-pad mesh near Pittsburgh. Every number is a placeholder (assumption = true), chosen only to be
# self-consistent; none is real data. Pads, lanes and demand come from the generator (spec 8.6).
# Busier than ab_synthetic, so recipients clear IN faster and drones leave IN at once.

schema_version = "1.2.0"

# No scheduled faults; random pad-controller faults still follow pad_ops.pc_fault_rate_per_h.
faults = []

[meta]
name = "mesh_small"
preset = "SYNTHETIC"
status = "COMPLETE"
city = "Pittsburgh"
description = "Synthetic mesh: eight pads drawn in a 3 km disc, lanes to the two nearest pads plus a spanning tree. Eight drones."

[sim]
