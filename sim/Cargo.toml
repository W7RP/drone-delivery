[package]
name = "drone-sim"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Discrete-event core of the drone-delivery network simulation (docs/spec.md)."

[lib]
name = "drone_sim"
path = "src/lib.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[dependencies]
serde_json = "1"
toml = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"
